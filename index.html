const cst=(m,i=0)=>Math.floor(m.b*Math.pow(GROW,S.lv[m.id]+i));
const bulk=m=>{let c=0;for(let i=0;i<q;i++)c+=cst(m,i);return c};
const mm=m=>Math.pow(2,HITOS.filter(h=>S.lv[m.id]>=h).length);
const lvs=()=>Object.values(S.lv).reduce((a,b)=>a+b,0);
const boostOn=()=>S.boost&&S.boost.until>Date.now();
const gmBase=()=>(1+S.cr*.05)*UP.filter(u=>u.t==='g'&&S.up[u.id]).reduce((a,u)=>a*u.v,1);
const gm=()=>gmBase()*(boostOn()?S.boost.x:1);
const expiry=m=>Math.max(S.act[m.id]||0,S.auto||0);
const isAct=m=>S.lv[m.id]>0&&expiry(m)>Date.now();
const power=()=>M.reduce((a,m)=>a+m.r*S.lv[m.id]*mm(m),0)*gmBase();
const rate=()=>M.reduce((a,m)=>a+(isAct(m)?m.r*S.lv[m.id]*mm(m):0),0)*gm();
const cp=()=>(1+Math.floor(power()/20))*UP.filter(u=>u.t==='c'&&S.up[u.id]).reduce((a,u)=>a*u.v,1)*(1+S.cr*.05);
const staked=()=>S.stakes.reduce((a,s)=>a+s.amt,0);
const invested=()=>S.invested+staked();
const dailyCap=()=>CFG.BASE_CAP+CFG.CAP_PER_INVEST*invested();
const minClaim=()=>Math.ceil(CFG.MIN_CLAIM_USD/CFG.FORGE_USD);
const genOK=()=>staked()*CFG.FORGE_USD>=CFG.GEN_USD;
const emi=()=>Math.max(.25,1/(1+S.total/2e6))*.01;
const cdLeft=()=>Math.max(0,S.lastClaim+CD-Date.now());
const claimRoom=()=>Math.max(0,dailyCap()-S.claimed);
function add(g){S.bal+=g;S.total+=g;const room=Math.max(0,dailyCap()-S.emitDay),x=Math.min(room,g*emi());S.pend+=x;S.emitDay+=x}
function offline(){const now=Date.now(),cap=(S.up.o2?86400:S.up.o1?43200:28800)*1000,from=Math.max(S.last,now-cap);let g=0;
 M.forEach(m=>{if(S.lv[m.id]>0){const secs=Math.max(0,Math.min(now,expiry(m))-from)/1000;if(secs>5)g+=m.r*S.lv[m.id]*mm(m)*gmBase()*secs}});
 if(g>0)add(g);return g}
function activate(ids){const t=Date.now()+DAY;let n=0;M.forEach(m=>{if(S.lv[m.id]>0&&(!ids||ids.includes(m.id))){S.act[m.id]=t;n++}});if(n){S.actDay=S.day;toast('⏻ '+n+(n>1?' mineros activados':' minero activado')+' por 24 h')}else toast('Aún no tienes mineros que activar');save()}
const prog=k=>k==='lvs'?lvs():k==='clicks'?S.clicks-S.base.clicks:k==='act'?(S.actDay===S.day?1:0):k==='stk'?(S.stakes.length?1:0):S.total-S.base.total;
const ethP=it=>(it.usd/CFG.ETH_USD).toFixed(6);
const forgeP=it=>Math.ceil(it.usd*(1-CFG.SHOP_DISCOUNT)/CFG.FORGE_USD);
function applyItem(it){const now=Date.now();
 if(it.id==='e1')add(Math.max(power()*1800,500));
 if(it.id==='e2')add(Math.max(power()*21600,3000));
 if(it.id==='b1'&&!(boostOn()&&S.boost.x>1.5))S.boost={x:1.5,until:now+DAY};
 if(it.id==='b2')S.boost={x:2,until:now+DAY};
 if(it.id==='a1')S.auto=Math.max(S.auto||0,now)+7*DAY;
 if(it.id==='c1')S.cr+=1;
 S.invested+=it.usd/CFG.FORGE_USD}

 if(tab==='ups')h=`<div class="note" style="text-align:center;margin-bottom:8px">Los precios suben a medida que avanzas. Las mejoras de producción multiplican entre sí.</div>`+UP.map((u,i)=>`<div class="card it" style="animation-delay:${i*.03}s"><div class="ico" style="font-size:28px;width:48px;height:48px;border-radius:13px;background:var(--card2);border:1px solid var(--line)">${u.k}</div><div class="t"><b>${u.n}</b><span>${u.d}</span></div>
  ${S.up[u.id]?'<span class="tag">Activa</span>':`<button class="btn" data-u="${u.id}" data-cost="${u.c}">${fmt(u.c)}</button>`}</div>`).join('');
 if(tab==='shop'){const ok=!!CFG.SHOP_ADDRESS;
  h=`<div class="card ${ok?'':'warn'}"><h3>Tienda</h3><p class="note" style="text-align:center">Paga con FORGE (${Math.round(CFG.SHOP_DISCOUNT*100)}% de descuento) o con ETH de ${esc(NET.name)}. ${ok?'Contrato verificado en el explorer.':'La tienda se activa en cuanto se despliegue su contrato.'}</p></div>`+
  SHOP.map((it,i)=>`<div class="card" style="animation-delay:${i*.04}s"><div class="it"><div class="ico" style="font-size:30px;width:52px;height:52px;border-radius:13px;background:var(--card2);border:1px solid var(--line)">${it.k}</div><div class="t"><b>${it.name}</b><span>${it.d}</span></div></div>
  <div class="two"><button class="btn g sm" data-buy="${it.id}" data-cur="forge">${forgeP(it)} FORGE</button><button class="btn sm" data-buy="${it.id}" data-cur="eth">${ethP(it)} ETH</button></div></div>`).join('')}
 if(tab==='stake'){const need=CFG.GEN_USD/CFG.FORGE_USD;
  h=`<div class="card"><h3>Staking de FORGE</h3><div class="kp"><div><small>En staking</small><b>${fmt(staked())}</b></div><div><small>Valor aprox.</small><b>$${(staked()*CFG.FORGE_USD).toFixed(2)}</b></div><div><small>Disponible</small><b>${fmt(S.pend)}</b></div></div>
  <p class="note" style="margin-top:10px">Bloquea FORGE ganado en el juego durante un plazo. Al terminar el plazo recibes tu capital más la recompensa, todo en FORGE. Las tasas son estimadas y pueden ajustarse según el fondo de recompensas. Con $${CFG.GEN_USD} (${fmt(need)} FORGE) en staking desbloqueas el minero Génesis.</p>
  <div class="stkrow" style="margin-top:10px"><input id="stkAmt" type="number" inputmode="decimal" min="10" step="any" placeholder="Cantidad (mín. 10 FORGE)"><button class="btn o sm" id="stkMax">Máx</button></div>
  <div class="two">${CFG.STAKE_PLANS.map((p,i)=>`<button class="btn g" data-plan="${i}">${p.d} días · ~${(p.r*100).toFixed(1)}%/día</button>`).join('')}</div></div>
  <h3>Tus stakings</h3>`+(S.stakes.length?S.stakes.map((s,i)=>{const done=Date.now()>=s.end,pay=s.amt*(1+s.r*s.d);return `<div class="card"><div class="it"><div class="t"><b>${fmt(s.amt)} FORGE · ${s.d} días</b><span>Recibirás ${fmt(pay)} FORGE · ${done?'<span class="chip on">Listo</span>':'faltan <span data-cd="'+s.end+'"></span>'}</span></div><button class="btn g sm" data-unst="${i}" ${done?'':'disabled'}>Retirar</button></div><div class="bar"><i style="width:${Math.min(100,(Date.now()-s.start)/(s.end-s.start)*100)}%"></i></div></div>`}).join(''):'<div class="card note" style="text-align:center">Aún no tienes stakings activos.</div>')}
 if(tab==='ms')h=MI.map(m=>{const p=Math.min(prog(m.k),m.g),d=p>=m.g,c=S.ms[m.id];
  return `<div class="card"><div class="it"><div class="t"><b>${m.n}</b><span>Recompensa: ${m.rw} $FORGE</span></div>
  <button class="btn g" data-ms="${m.id}" ${d&&!c?'':'disabled'}>${c?'Reclamada ✓':'Reclamar'}</button></div>
  <div class="bar"><i style="width:${p/m.g*100}%"></i></div><div class="row"><span>${fmt(p)} / ${fmt(m.g)}</span><span>Se reinicia a diario</span></div></div>`}).join('');
 if(tab==='rk'){h=`<div class="card"><h3>Ranking mundial · poder de minado</h3><div id="rkl" class="note" style="text-align:center">Cargando…</div></div><div class="card it"><div class="ico" style="font-size:26px">🏆</div><div class="t"><b>Premios semanales</b><span>El 10% del suministro se reparte entre los mejores del ranking. Próximo cierre en <b data-cd="${nextMon()}"></b></span></div></div>`;loadRank()}
 if(tab==='tk'){const D=[['Jugadores (minería y recompensas)',50,'#14f195'],['Liquidez',20,'#8a4dff'],['Equipo (bloqueado)',20,'#4cc9f0'],['Premios semanales de ranking',10,'#ffd24a']];let o=0;
  h=`<div class="card"><h3>Tu $FORGE en cadena</h3><div class="bal"><div class="n" style="font-size:28px">${!CFG.FORGE_ADDRESS?'—':chainBal===null?'…':fmt(chainBal)}</div></div>
  <div class="row" style="justify-content:center;flex-wrap:wrap">${esc(NET.name)}${CFG.FORGE_ADDRESS?' · <a href="'+NET.ex+'/address/'+CFG.FORGE_ADDRESS+'" target="_blank" rel="noopener" style="color:var(--c)">Ver contrato</a>':' · contrato pendiente de despliegue'}</div></div>
  <div class="card"><h3>Distribución · 1.000.000.000 FORGE</h3><div class="it"><svg width="130" height="130" viewBox="0 0 36 36" style="flex:none;transform:rotate(-90deg)">${D.map(d=>{const s=`<circle cx="18" cy="18" r="15.9155" fill="none" stroke="${d[2]}" stroke-width="4.5" stroke-dasharray="${d[1]-1} ${101-d[1]}" stroke-dashoffset="${-o}"/>`;o+=d[1];return s}).join('')}</svg>
  <div class="leg">${D.map(d=>`<div><i style="background:${d[2]}"></i>${d[0]} <b>${d[1]}%</b></div>`).join('')}</div></div></div>
  <h3>Cómo funciona</h3><div class="card leg"><div>⚡ <b>Energía</b> (en juego, ilimitada) y <b>$FORGE</b> (token, escaso) están separados.</div><div>📉 La emisión de FORGE decrece mientras más se mina en total.</div><div>🛑 Límite diario de retiro (sube con lo que inviertes) y enfriamiento de 1 h entre retiros.</div><div>💵 Retiro mínimo: $${CFG.MIN_CLAIM_USD} en FORGE (${minClaim()} FORGE).</div><div>🔥 El ${BURN*100}% de cada retiro se quema.</div><div>🔒 Suministro máximo fijo en el contrato: nadie puede crear más FORGE.</div><div>👛 Token ERC-20 en ${esc(NET.name)}, compatible con MetaMask.</div><div>🕒 Los retiros se registran y se procesan hasta el lanzamiento oficial.</div></div>`}
 $('view').innerHTML=h;upd();afford();
}

async function loadRank(){
 const box=()=>$('rkl');
 if(!sb){if(box())box().textContent='Ranking no disponible (sin conexión).';return}
 if(rankCache&&Date.now()-rankAt<15000){drawRank();return}
 const {data,error}=await sb.from('players').select('wallet,name,flag,power').order('power',{ascending:false}).limit(50);
 if(error){if(box())box().textContent='No se pudo cargar el ranking.';return}
 rankCache=data||[];rankAt=Date.now();if(tab==='rk')drawRank()}
function drawRank(){const b=$('rkl');if(!b)return;
 if(!rankCache.length){b.textContent='Aún no hay jugadores. ¡Sé el primero!';return}
 b.style.textAlign='left';b.className='';
 b.innerHTML=rankCache.map((x,i)=>`<div class="rk ${x.wallet===WALLET?'me':''}"><em>${i+1}</em><span>${esc(flagOf(x.flag))} ${esc(x.name)}</span><b>${fmt(+x.power)}/s</b></div>`).join('')+
 (rankCache.some(x=>x.wallet===WALLET)?'':`<div class="rk me"><em>·</em><span>${esc(flagOf(S.profile.flag))} ${esc(S.profile.name)} (tú)</span><b>${fmt(power())}/s</b></div>`)}
function nextMon(){const d=new Date(),add=((8-d.getUTCDay())%7)||7;return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+add)}

let dB=0;
function upd(){
 $('rate').textContent=fmt(rate());$('pow').textContent=fmt(power());$('cr').textContent=S.cr;
 if(tab==='mine'&&ready()&&$('claim')){$('cpw').textContent=fmt(cp());$('pend').textContent=fmt(S.pend);
  const mn=minClaim(),p=Math.min(S.pend/mn,1);$('ringp').style.strokeDashoffset=213.6*(1-p);$('ringt').textContent=Math.floor(p*100)+'%';
  const cd=cdLeft(),room=claimRoom();
  $('claim').disabled=!(S.pend>=mn&&room>=mn&&!cd);
  $('claim').textContent=cd?'Enfriamiento '+Math.ceil(cd/60000)+' min':room<mn?'Límite diario alcanzado':S.pend<mn?'Mínimo '+mn+' $FORGE ($'+CFG.MIN_CLAIM_USD+')':'Solicitar retiro';
  $('eco').innerHTML='<span>Retirado hoy '+fmt(S.claimed)+'/'+fmt(dailyCap())+'</span><span>Emisión '+Math.round(emi()/.01*100)+'%</span><span>🔥 '+fmt(S.burned)+'</span>';draw()}
 document.querySelectorAll('[data-cd]').forEach(e=>{const t=+e.dataset.cd-Date.now();e.textContent=t>0?cdText(t):'terminó'})}
function draw(){const c=$('cv');if(!c)return;const d=devicePixelRatio||1,w=c.clientWidth*d,h=c.clientHeight*d;if(c.width!==w){c.width=w;c.height=h}
 const x=c.getContext('2d');x.clearRect(0,0,w,h);x.strokeStyle='rgba(150,144,192,.15)';x.lineWidth=1;for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke()}
 const a=S.hist;if(a.length<2)return;const mx=Math.max(...a,1)*1.1,P=a.map((v,i)=>[i/(a.length-1)*w,h-6*d-v/mx*(h-14*d)]);
 const gr=x.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(0,240,255,.45)');gr.addColorStop(1,'rgba(0,240,255,0)');
 x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.lineTo(w,h);x.lineTo(0,h);x.fillStyle=gr;x.fill();
 x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.strokeStyle='#14f195';x.lineWidth=2.5*d;x.shadowColor='#14f195';x.shadowBlur=10*d;x.lineJoin='round';x.stroke();
 const l=P[P.length-1];x.beginPath();x.arc(l[0]-3*d,l[1],4*d,0,7);x.fillStyle='#fff';x.fill()}
const afford=()=>document.querySelectorAll('[data-cost]').forEach(b=>b.disabled=S.bal<+b.dataset.cost);

// ===================== CADENA =====================
async function ensureChain(eth){
 try{await eth.request({method:'wallet_switchEthereumChain',params:[{chainId:NET.hex}]})}
 catch(e){if(e&&(e.code===4902||e.code===-32603)){await eth.request({method:'wallet_addEthereumChain',params:[{chainId:NET.hex,chainName:NET.name,nativeCurrency:{name:'Ether',symbol:'ETH',decimals:18},rpcUrls:[NET.rpc],blockExplorerUrls:[NET.ex]}]})}else throw e}}
async function refreshOnchain(){chainBal=null;
 if(CFG.FORGE_ADDRESS&&WALLET&&window.ethereum){try{const data='0x70a08231'+WALLET.slice(2).padStart(64,'0');
  const r=await window.ethereum.request({method:'eth_call',params:[{to:CFG.FORGE_ADDRESS,data},'latest']});chainBal=Number(BigInt(r)/10n**14n)/1e4}catch(e){}}
 if(tab==='tk'&&ready())view()}
async function connect(){
 const eth=window.ethereum;if(!eth){toast('Instala MetaMask u otra billetera EVM para jugar');return}
 try{const a=await eth.request({method:'eth_requestAccounts'});await ensureChain(eth);loadFor(a[0]);view()}
 catch(e){toast('No se pudo conectar: '+((e&&e.message)||'cancelado'))}}
function logout(){save();WALLET=null;S=defS();lsSet('fm_last','');view()}
async function buyItem(id,cur){
 const it=SHOP.find(x=>x.id===id);
 if(!CFG.SHOP_ADDRESS||!window.ethereum||typeof ethers==='undefined'){toast('🛒 La tienda se activa al desplegar su contrato');return}
 try{await ensureChain(window.ethereum);const sg=await new ethers.BrowserProvider(window.ethereum).getSigner(),shop=new ethers.Contract(CFG.SHOP_ADDRESS,SHOP_ABI,sg);
  if(cur==='eth'){const tx=await shop.buyWithEth(it.n,{value:ethers.parseEther(ethP(it))});toast('⏳ Confirmando…');await tx.wait()}
  else{if(!CFG.FORGE_ADDRESS){toast('Token FORGE aún sin desplegar');return}
   const tk=new ethers.Contract(CFG.FORGE_ADDRESS,TOKEN_ABI,sg),amt=ethers.parseUnits(String(forgeP(it)),18);
   if((await tk.allowance(WALLET,CFG.SHOP_ADDRESS))<amt){const t1=await tk.approve(CFG.SHOP_ADDRESS,amt);toast('⏳ Aprobando FORGE…');await t1.wait()}
   const tx=await shop.buyWithForge(it.n);toast('⏳ Confirmando…');await tx.wait()}
  applyItem(it);toast('✅ Compra confirmada: '+it.name);view();save();refreshOnchain()}
 catch(e){toast('Compra cancelada o fallida')}}
async function doClaim(){
 const mn=minClaim(),l=Math.min(S.pend,claimRoom());
 if(l<mn||cdLeft())return;
 if(!sb){toast('Sin conexión con el servidor de retiros');return}
 const bn=l*BURN,net=l-bn;
 const {error}=await sb.from('withdrawals').insert({wallet:WALLET,amount:Math.round(net*1e4)/1e4,burned:Math.round(bn*1e4)/1e4,status:'pending'});
 if(error){toast('No se pudo registrar el retiro, intenta de nuevo');return}
 S.pend-=l;S.claimed+=l;S.lastClaim=Date.now();S.burned+=bn;
 toast('✅ Retiro solicitado: '+fmt(net)+' FORGE (🔥 '+fmt(bn)+' quemados)');upd();save()}
async function syncPlayer(){
 if(!sb||!ready())return;
 const {error}=await sb.from('players').upsert({wallet:WALLET,name:S.profile.name,flag:S.profile.flag,power:Math.round(power()*100)/100,total:Math.round(S.total),updated_at:new Date().toISOString()},{onConflict:'wallet'});
 if(error)console.warn('ranking:',error.message)}

// ===================== EVENTOS =====================
function burst(cx,cy){if(REDUCE)return;for(let i=0;i<7;i++){const c=document.createElement('div');c.className='coin';c.style.left=cx+'px';c.style.top=cy+'px';const a=Math.random()*6.28,r=40+Math.random()*50;c.style.setProperty('--dx',Math.cos(a)*r+'px');c.style.setProperty('--dy',Math.sin(a)*r-20+'px');document.body.appendChild(c);setTimeout(()=>c.remove(),700)}}
document.addEventListener('click',e=>{const t=e.target;
 if(t.closest('#gc')){connect();return}
 if(!ready())return;
 if(t.closest('#orb')){const g=cp();add(g);S.clicks++;const p=document.createElement('div');p.className='pop';p.textContent='+'+fmt(g);p.style.left=(e.clientX-12)+'px';p.style.top=(e.clientY-30)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),850);burst(e.clientX,e.clientY);upd();afford();return}
 let b=t.closest('[data-q]');if(b){q=+b.dataset.q;view();return}
 b=t.closest('[data-actall]');if(b){activate();view();return}
 b=t.closest('[data-act]');if(b){activate([b.dataset.act]);view();return}
 b=t.closest('[data-m]');if(b){const m=M.find(x=>x.id===b.dataset.m),c=bulk(m);
  if(m.lock&&!genOK()){toast('🔒 Necesitas $'+CFG.GEN_USD+' en FORGE en staking');return}
  if(S.bal>=c){const old=HITOS.filter(h=>S.lv[m.id]>=h).length,first=S.lv[m.id]===0;S.bal-=c;S.lv[m.id]+=q;if(first)S.act[m.id]=Date.now()+DAY;
   if(HITOS.filter(h=>S.lv[m.id]>=h).length>old)toast('🎉 ¡Hito alcanzado! '+m.n+' produce x2');dB=Math.min(dB,S.bal);view();save()}return}
 b=t.closest('[data-u]');if(b){const u=UP.find(x=>x.id===b.dataset.u);if(S.bal>=u.c){S.bal-=u.c;S.up[u.id]=1;toast('✅ '+u.n+' activada');view();save()}return}
 b=t.closest('[data-ms]');if(b){const m=MI.find(x=>x.id===b.dataset.ms);if(S.ms[m.id])return;S.ms[m.id]=1;S.pend+=m.rw;toast('🎯 +'+m.rw+' $FORGE');view();save();return}
 b=t.closest('[data-buy]');if(b){buyItem(b.dataset.buy,b.dataset.cur);return}
 if(t.closest('#stkMax')){const i=$('stkAmt');if(i)i.value=Math.floor(S.pend*100)/100;return}
 b=t.closest('[data-plan]');if(b){const p=CFG.STAKE_PLANS[+b.dataset.plan],amt=parseFloat($('stkAmt').value);
  if(!(amt>=10)){toast('Mínimo 10 FORGE');return}if(amt>S.pend){toast('No tienes tanto FORGE disponible');return}
  S.pend-=amt;S.stakes.push({amt,start:Date.now(),end:Date.now()+p.d*DAY,r:p.r,d:p.d});toast('🔒 '+fmt(amt)+' FORGE en staking por '+p.d+' días');view();save();return}
 b=t.closest('[data-unst]');if(b){const s=S.stakes[+b.dataset.unst];if(s&&Date.now()>=s.end){const pay=s.amt*(1+s.r*s.d);S.pend+=pay;S.stakes.splice(+b.dataset.unst,1);toast('✅ +'+fmt(pay)+' FORGE (capital + recompensa)');view();save()}return}
 if(t.closest('#claim')){doClaim();return}
 if(t.closest('#asc')){const nc=Math.floor(Math.sqrt(S.total/1e4));if(nc>S.cr&&confirm('¿Ascender? Reinicias mineros y mejoras, pero ganas '+(nc-S.cr)+' 💎')){S.cr=nc;S.bal=0;dB=0;S.up={};S.act={};M.forEach(m=>S.lv[m.id]=0);toast('💎 ¡Has ascendido!');view();save()}return}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='pf')return;e.preventDefault();
 const name=$('pn').value.trim(),cc=$('pc').value,mail=$('pe').value.trim();
 if(!/^[\p{L}\p{N}_ .-]{3,16}$/u.test(name)){toast('Nombre inválido: usa 3–16 letras o números');return}
 if(!CC.includes(cc)){toast('Selecciona tu país');return}
 if(mail&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){toast('Correo inválido');return}
 S.profile={name,flag:cc};save();
 if(mail&&sb&&!S.mailSent){const {error}=await sb.from('player_emails').upsert({wallet:WALLET,email:mail},{onConflict:'wallet',ignoreDuplicates:true});if(!error){S.mailSent=true;save()}}
 view();syncPlayer();toast('✅ ¡Bienvenido, '+name+'!')});
$('wallet').onclick=()=>{WALLET?logout():connect()};
if(window.ethereum&&window.ethereum.on){
 window.ethereum.on('accountsChanged',a=>{if(a&&a[0]){save();loadFor(a[0]);view()}else logout()});
 window.ethereum.on('chainChanged',()=>refreshOnchain())}

// ===================== BUCLES =====================
setInterval(()=>{if(!ready())return;rollDay();const f=rate();if(f>0)add(f);S.hist.push(f);if(S.hist.length>60)S.hist.shift();
 const on=M.some(isAct);if(prevOn&&!on&&M.some(m=>S.lv[m.id]>0))toast('⏻ Tus mineros se apagaron. Actívalos para seguir minando');prevOn=on;
 upd();afford();save()},1000);
setInterval(syncPlayer,30000);
setInterval(()=>{if(tab==='rk'&&ready()){rankAt=0;loadRank()}},30000);
(function loop(){dB+=(S.bal-dB)*.18;if(Math.abs(S.bal-dB)<.05)dB=S.bal;$('bal').textContent=fmt(dB);requestAnimationFrame(loop)})();
(async function init(){
 if(window.ethereum){try{const a=await window.ethereum.request({method:'eth_accounts'});if(a[0]&&lsGet('fm_last')===a[0].toLowerCase())loadFor(a[0])}catch(e){}}
 view();if(ready())syncPlayer()})();
